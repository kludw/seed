name: ci

on:
  push:
    branches: [main, "seed-v2*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build (bootstrap, three stages)
        timeout-minutes: 15
        run: make

      - name: Fixed point and snapshot
        run: make verify

      - name: Core language
        timeout-minutes: 20
        run: make test

      - name: Full language and seed command
        timeout-minutes: 20
        run: make test-full

      - name: Standard library
        timeout-minutes: 20
        run: make test-lib

      - name: Formatter
        timeout-minutes: 20
        run: make test-fmt

      - name: Examples
        timeout-minutes: 20
        run: make test-examples

      - name: Language server
        run: make test-lsp

      - name: Guide
        timeout-minutes: 20
        run: docs/guide/check.sh

      - name: Runtime (asan, tsan, plain)
        timeout-minutes: 20
        run: runtime/tests/run.sh

      - name: Leaks
        timeout-minutes: 30
        run: make test-leaks

      - name: Concurrency soak
        timeout-minutes: 20
        shell: bash
        run: |
          set +e  # the crash tests exit non-zero on purpose
          fails=0
          for f in tests/full/*group*.sd tests/full/*chan*.sd tests/full/*select*.sd tests/full/*spawn*.sd tests/full/preempt*.sd; do
            n=${f%.sd}; [ -f "$n.out" ] || continue
            b=build/soak-$(basename "$n"); build/seed2 build -o "$b" "$f" > /dev/null
            want=0; [ -f "$n.exit" ] && want=$(cat "$n.exit")
            for p in 1 2 4; do for k in 1 2 3 4 5; do
              in=/dev/null; [ -f "$n.in" ] && in="$n.in"
              SEED_PROCS=$p "$b" < "$in" > build/soak.out 2> build/soak.err; c=$?
              if [ "$c" != "$want" ] || ! cmp -s build/soak.out "$n.out"; then
                fails=$((fails+1)); echo "FAIL SEED_PROCS=$p $f (exit $c)"
              fi
            done; done
          done
          echo "soak failures: $fails"; [ "$fails" = 0 ]
